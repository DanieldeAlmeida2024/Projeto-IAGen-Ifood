name: Baseline e avaliação do recomendador
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  recomendador:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python principal.py --avaliar --quantidade 5
