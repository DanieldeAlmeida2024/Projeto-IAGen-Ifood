name: Testes Python e pipeline SVD
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline sem dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testes do baseline determinístico
        run: python -m unittest discover -s tests -p 'test_recomendacao.py' -v

  svd:
    name: SVD com SciPy/pandas/Surprise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependências mínimas de pesquisa
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24,<2" "pandas>=2,<3" "scipy>=1.10,<2" "scikit-surprise==1.1.4" "joblib>=1.3"
      - name: Validar Loader, matriz CSR, treino e persistência
        run: |
          python -m unittest discover -s tests -p 'test_mf_model.py' -v
          python -m unittest discover -s tests -p 'test_evaluation.py' -v
          python -m unittest discover -s tests -p 'test_evaluation_multi_seed.py' -v
          python -m unittest discover -s tests -p 'test_temporal_validation.py' -v
      - name: Avaliação offline reproduzível (sem afirmar melhoria)
        run: |
          python -m src.evaluation --k 5 --seed 42 | tee evaluation-summary.json
          python -m json.tool evaluation-summary.json > /dev/null
      - name: Publicar métricas para revisão
        uses: actions/upload-artifact@v4
        with:
          name: offline-ranking-evaluation
          path: evaluation-summary.json
          retention-days: 14

      - name: Reprodutibilidade e sensibilidade multi-seed sem dados reais
        run: |
          python -m src.evaluation_multi_seed --k 5 --seeds 42,43,44,45,46 | tee evaluation-robustness.json
          python -m json.tool evaluation-robustness.json > /dev/null
      - name: Publicar análise descritiva de seeds
        uses: actions/upload-artifact@v4
        with:
          name: offline-ranking-multi-seed
          path: evaluation-robustness.json
          retention-days: 14

      - name: Validar cronologia e cold start com fixture sintética
        run: |
          python -m src.temporal_validation --arquivo tests/fixtures/temporal_interactions.csv --cutoff 2026-01-02T00:00:00Z | tee temporal-validation.json
          python -m json.tool temporal-validation.json > /dev/null
      - name: Publicar contagem temporal sem dados pessoais
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-temporal-validation
          path: temporal-validation.json
          retention-days: 14
