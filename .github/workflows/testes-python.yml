name: Testes Python e pipeline SVD
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline sem dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testes do baseline determinístico
        run: python -m unittest discover -s tests -p 'test_recomendacao.py' -v

  svd:
    name: SVD com SciPy/pandas/Surprise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependências mínimas de pesquisa
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24,<2" "pandas>=2,<3" "scipy>=1.10,<2" "scikit-surprise==1.1.4" "joblib>=1.3"
      - name: Validar Loader, matriz CSR, treino e persistência
        run: |
          python -m unittest discover -s tests -p 'test_mf_model.py' -v
          python -m unittest discover -s tests -p 'test_evaluation.py' -v
      - name: Avaliação offline reproduzível (sem afirmar melhoria)
        run: |
          python -m src.evaluation --k 5 --seed 42 | tee evaluation-summary.json
          python -m json.tool evaluation-summary.json > /dev/null
      - name: Publicar métricas para revisão
        uses: actions/upload-artifact@v4
        with:
          name: offline-ranking-evaluation
          path: evaluation-summary.json
          retention-days: 14
