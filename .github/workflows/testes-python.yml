name: Testes Python e pipeline SVD
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline sem dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Testes do baseline determinístico
        run: python -m unittest discover -s tests -p 'test_recomendacao.py' -v

  svd:
    name: SVD com SciPy/pandas/Surprise
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependências mínimas de pesquisa
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24,<2" "pandas>=2,<3" "scipy>=1.10,<2" "scikit-surprise==1.1.4" "joblib>=1.3"
      - name: Validar Loader, matriz CSR, treino e persistência
        run: python -m unittest discover -s tests -p 'test_mf_model.py' -v
